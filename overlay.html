<!doctype html>
<html lang="en" data-theme="twitch"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kindle overlay</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{font-family:'Bricolage Grotesque',sans-serif;color-scheme:dark;--bg:#0E0E10;--surface:#1F1F23;--surface-2:#28282d;--border:#38383e;--text:#f2f0f5;--text-muted:#a4a1aa;--accent:#9146FF;--heat-1:#74c69d;--heat-2:#f2c14e;--heat-3:#f08c46;--heat-4:#fa5b64;--mono:'IBM Plex Mono',monospace}html[data-theme=cuisine]{--bg:#1A1411;--surface:#2A201A;--surface-2:#34271f;--border:#49382d;--text:#fff4ec;--text-muted:#c1a99a;--accent:#E8643C;--heat-1:#8bd1a5;--heat-2:#f2c14e;--heat-3:#ef9257;--heat-4:#ff6b61}html[data-theme=jeux]{--bg:#0B0F14;--surface:#131A22;--surface-2:#1b2530;--border:#2b3946;--text:#eef7f7;--text-muted:#a3b4b8;--accent:#7EE0C3;--heat-1:#7ee0c3;--heat-2:#f2ce70;--heat-3:#efa16f;--heat-4:#f27d86}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent!important}body{color:var(--text);font-family:'Bricolage Grotesque',sans-serif}.preview{background-color:#17191d!important;background-image:linear-gradient(45deg,#24272d 25%,transparent 25%),linear-gradient(-45deg,#24272d 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#24272d 75%),linear-gradient(-45deg,transparent 75%,#24272d 75%)!important;background-size:28px 28px!important;background-position:0 0,0 14px,14px -14px,-14px 0!important}.stage{position:fixed;inset:0;overflow:hidden;pointer-events:none}.overlay-card{position:absolute;left:48px;bottom:48px;width:min(600px,calc(100vw - 96px));border:1px solid var(--border);border-radius:18px;background:var(--surface);color:var(--text);padding:23px 26px 21px;box-shadow:0 18px 50px #0006;opacity:0;transform:translate3d(0,15px,0);transition:opacity 240ms ease,transform 240ms cubic-bezier(.2,.7,.25,1);overflow:hidden}.overlay-card:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.045;background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,#fff 4px)}html[data-theme=jeux] .overlay-card:before{background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:24px 24px}html[data-theme=twitch] .overlay-card:before{display:none}.overlay-card.visible{opacity:1;transform:translate3d(0,0,0)}.content{position:relative}.question{font-size:25px;line-height:1.28;letter-spacing:-.035em;font-weight:600;margin:0 0 16px;overflow-wrap:anywhere}.original{display:flex;align-items:baseline;gap:8px;color:var(--text-muted);font-size:12px;line-height:1.45;margin:-7px 0 15px;overflow-wrap:anywhere}.original[hidden]{display:none}.original-lang{font:9px var(--mono);letter-spacing:.06em;white-space:nowrap}.meta{display:flex;align-items:center;gap:12px}.author{font-size:12px;color:var(--text-muted)}.heat{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--heat);font-size:11px;font-weight:600}.dash{width:24px;height:4px;border-radius:5px;background:var(--heat)}.count{color:var(--text);font:600 17px var(--mono);letter-spacing:-.05em}.tier{font-size:10px}.count.pulse{animation:vote-pulse 240ms ease-out}@keyframes vote-pulse{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}.motion-off *{transition:none!important;animation:none!important}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}@media(max-width:600px){.overlay-card{left:20px;bottom:20px;width:calc(100vw - 40px);padding:18px 19px}.question{font-size:20px}}.overlay-card[hidden]{display:none}
</style></head><body><main class="stage"><article class="overlay-card" id="card" hidden aria-live="polite"><div class="content"><p class="question" id="question"></p><p class="original" id="original" hidden><span class="original-lang" id="originalLang"></span><span id="originalText"></span></p><div class="meta"><span class="author" id="author"></span><div class="heat" id="heat"><span class="dash"></span><span class="count" id="count"></span><span class="tier" id="tier"></span></div></div></div></article></main><script>
const card=document.getElementById('card'),questionText=document.getElementById('question'),originalLine=document.getElementById('original'),originalLang=document.getElementById('originalLang'),originalText=document.getElementById('originalText'),authorText=document.getElementById('author'),heatGroup=document.getElementById('heat'),countText=document.getElementById('count'),tierText=document.getElementById('tier');const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');let latestState=null,currentId=null,lastVotes=0,transitionTimer=null,revision=0;const preview=new URLSearchParams(location.search).get('preview')==='1';if(preview)document.body.classList.add('preview');function tierFor(votes){if(votes>=6)return {name:'Blaze',color:'var(--heat-4)'};if(votes>=4)return {name:'Flame',color:'var(--heat-3)'};if(votes>=2)return {name:'Ember',color:'var(--heat-2)'};return {name:'Spark',color:'var(--heat-1)'}}function applyStateSettings(state){document.documentElement.dataset.theme=['twitch','cuisine','jeux'].includes(state.theme)?state.theme:'twitch';document.body.classList.toggle('motion-off',!!state.lessAnimation)}function updateCopy(q){const original=q.originalText||q.text,displayed=q.displayedText||original;questionText.textContent=displayed;originalLine.hidden=displayed===original;originalLang.textContent=({fr:'FR',en:'EN',es:'ES'}[q.lang]||'OTHER')+' · original';originalText.textContent=original}function renderQuestion(q,token){if(token!==revision||!q)return;updateCopy(q);authorText.textContent=q.author;const votes=q.voteCount??q.votes?.length??0;const tier=tierFor(votes);countText.textContent='×'+votes;heatGroup.style.setProperty('--heat',tier.color);tierText.textContent=tier.name;lastVotes=votes;card.hidden=false;requestAnimationFrame(()=>{if(token===revision)card.classList.add('visible')});currentId=q.id}function receive(state){latestState=state;applyStateSettings(state);const target=(state.questions||[]).find(q=>q.id===state.onScreenId&&q.status==='open')||null;if(target&&target.id===currentId&&!card.hidden){if(transitionTimer){clearTimeout(transitionTimer);transitionTimer=null;revision++}card.classList.add('visible');const votes=target.voteCount??target.votes?.length??0;updateCopy(target);authorText.textContent=target.author;const tier=tierFor(votes);heatGroup.style.setProperty('--heat',tier.color);tierText.textContent=tier.name;if(votes>lastVotes){countText.classList.remove('pulse');void countText.offsetWidth;countText.classList.add('pulse')}countText.textContent='×'+votes;lastVotes=votes;return}if(!target&&currentId===null&&card.hidden)return;if(!target&&!card.hidden&&!card.classList.contains('visible')){if(reduced.matches||state.lessAnimation){if(transitionTimer)clearTimeout(transitionTimer);transitionTimer=null;card.hidden=true;currentId=null}return}if(target&&target.id===currentId&&card.hidden){const token=++revision;renderQuestion(target,token);return}const token=++revision;if(transitionTimer){clearTimeout(transitionTimer);transitionTimer=null}if(!card.hidden){card.classList.remove('visible');if(reduced.matches||state.lessAnimation){card.hidden=true;currentId=null;if(target)renderQuestion(target,token)}else{transitionTimer=setTimeout(()=>{if(token!==revision)return;card.hidden=true;currentId=null;if(target)renderQuestion(target,token);transitionTimer=null},260)}}else{currentId=null;if(target)renderQuestion(target,token)}}const events=new EventSource('/api/events');events.addEventListener('state',event=>{try{receive(JSON.parse(event.data))}catch{}});reduced.addEventListener?.('change',()=>{if(latestState)receive(latestState)});
</script></body></html>
